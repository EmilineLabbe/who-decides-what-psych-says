name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned versions in requirements.txt are built for this interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # Installing the full pinned set, rather than the test dependencies alone,
      # also checks that requirements.txt still resolves.
      - run: pip install -r requirements.txt

      - run: pytest
